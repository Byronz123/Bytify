services:
  - type: web
    name: bytify-api
    runtime: node
    # free = tidur setelah 15 menit tanpa request; starter = menyala 24/7.
    plan: free
    region: singapore
    branch: main  # <-- UBAH INI ke nama branch Anda (misal: main atau master)
    rootDir: backend/api
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info