services:
  - type: web
    name: bytify-api
    runtime: node
    plan: free
    region: singapore
    branch: feature/complete-1.3.0
    rootDir: backend/api
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info